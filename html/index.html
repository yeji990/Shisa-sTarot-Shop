<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>시사의 타로가게</title>
<style>
/* 레이아웃: 자주색 밤 + 뒤에 옅은 별자리 원반. 위에 간판, 가운데 시사와 말풍선, 그 아래 무대가 단계별로 바뀜(이름 → 주제 → 질문 → 카드). 맨 아래 보라색 촛불 줄 */
@font-face{font-family:"Pretendard";font-weight:45 920;font-display:swap;
  src:url("pretendard.woff2") format("woff2-variations"),url("pretendard.woff2") format("woff2")}
:root{
  color-scheme:dark;
  --bg:#2a1538; --panel:#3a1f4b; --line:#5b3c6e; --on:#fff6e3; --onsoft:#c9b4d6;
  --gold:#e2b06a; --star:#f2c14e; --surface:#fff6e3; --ink:#45182f; --soft:#74557c; --plum:#7a2550; --candle:#8a4f9e;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--on);font-family:var(--font);font-size:16px;line-height:1.6;overflow-x:hidden;
  padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shop{position:relative;max-width:860px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:28px}
.shop > *{position:relative;width:100%}
#wheel{position:absolute;top:-40px;left:50%;width:min(760px,100%);transform:translateX(-50%);opacity:.16;pointer-events:none}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--star);outline-offset:3px}
.brand{margin:0;text-align:center;font-size:17px;font-weight:700;letter-spacing:.12em;color:var(--gold)}

/* 시사 */
.teller{display:flex;flex-direction:column;align-items:center;gap:6px}
.photo{position:relative;width:min(190px,48vw);aspect-ratio:1;display:grid;place-items:center}
.photo.has{border:0}
.photo img{width:100%;height:100%;object-fit:contain}
.photo input,.tools input{position:absolute;opacity:0;width:1px;height:1px}
.photo:focus-within{outline:3px solid var(--star);outline-offset:3px}
.bubble{background:var(--surface);color:var(--ink);border-radius:18px;padding:12px 22px;font-size:17px;font-weight:500;text-align:center;
  position:relative;max-width:30em;white-space:pre-line;word-break:keep-all}
.bubble::before{content:"";position:absolute;top:-7px;left:50%;width:14px;height:14px;background:var(--surface);transform:translateX(-50%) rotate(45deg)}

/* 무대 */
.step{display:flex;flex-direction:column;align-items:center;gap:20px;animation:in .45s ease both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1,h2{margin:0;text-align:center;font-weight:800;letter-spacing:-.03em;line-height:1.2;text-wrap:balance;word-break:keep-all}
h1{font-size:clamp(28px,6vw,46px)}
h2{font-size:clamp(24px,5vw,36px)}
.sub{margin:-10px 0 0;text-align:center;color:var(--onsoft);font-size:15px;word-break:keep-all}
.topics{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 22px}
.topic{background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;width:84px}
.topic .ring{width:68px;height:68px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;
  font-size:28px;line-height:1;color:var(--gold);font-variant-emoji:text;transition:border-color .2s,transform .2s,background .2s}
.topic b{font-size:13px;font-weight:700;letter-spacing:.04em}
.topic:hover .ring,.topic:focus-visible .ring{border-color:var(--gold);background:#e2b06a1c;transform:translateY(-3px)}

.ask{display:flex;width:min(560px,100%);background:var(--panel);border:1px solid var(--gold);border-radius:999px;padding:6px 6px 6px 22px;gap:8px}
.ask input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:17px}
.ask input::placeholder{color:var(--onsoft)}
.ask:focus-within{box-shadow:0 0 0 3px #e2b06a55}
.go{flex:none;width:64px;height:44px;border-radius:999px;border:0;background:var(--gold);color:#241505;font-size:22px;line-height:1;cursor:pointer}
.marquee{width:100%;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.track{display:flex;gap:10px;width:max-content;animation:slide 45s linear infinite}
.marquee:hover .track,.marquee:focus-within .track{animation-play-state:paused}
@keyframes slide{to{transform:translateX(-50%)}}
.q{flex:none;background:#ffffff14;border:0;border-radius:999px;padding:7px 16px;font-size:14px;cursor:pointer;white-space:nowrap}
.q:hover{background:#ffffff26}
.or{display:flex;align-items:center;gap:12px;width:min(320px,100%);color:var(--onsoft);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.ghost{background:none;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:11px 28px;font-size:16px;font-weight:600;cursor:pointer}
.ghost:hover{background:#e2b06a1c}
.row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 20px;cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#241505;font-weight:700}
.link{background:none;border:0;color:var(--onsoft);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:14px}
.asked{margin:-8px 0 0;color:var(--gold);font-size:15px;text-align:center;word-break:keep-all}

/* 카드 */
.back{background:url("cards/back.webp") center/cover,var(--backimg,
  radial-gradient(circle at 50% 50%,var(--star) 0 7%,transparent 8%),
  radial-gradient(circle at 50% 50%,transparent 0 17%,var(--star) 18% 20%,transparent 21%),
  var(--plum));
  border:0;border-radius:8px;box-shadow:0 2px 0 #0005}
.wheel{position:relative;width:100%;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;--cw:84px;--R:330px;
  height:calc(var(--cw)*1.5 + 150px)}
.wheel.drag{cursor:grabbing}
#spin{position:absolute;left:50%;top:calc(20px + var(--cw)*.75 + var(--R));width:0;height:0;transition:transform .7s cubic-bezier(.05,.7,.1,1)}
.wheel.drag #spin{transition:none}
.wc{position:absolute;left:calc(var(--cw)/-2);top:calc(var(--cw)*-.75);width:var(--cw);height:calc(var(--cw)*1.5);
  transform:rotate(var(--a)) translateY(calc(var(--R)*-1)) scale(var(--s,1));opacity:.38;cursor:pointer;transition:opacity .3s,transform .3s}
.wc.cur{opacity:1;--s:1.1}
.wc.gone{visibility:hidden}
.hub{position:absolute;left:50%;top:calc(20px + var(--cw)*.75 + var(--R));width:calc((var(--R) - var(--cw)*.75 - 26px)*2);aspect-ratio:1;
  transform:translate(-50%,-50%);border-radius:50%;border:2px solid var(--gold);pointer-events:none;
  background:repeating-conic-gradient(from -8.18deg,transparent 0 15.86deg,var(--gold) 15.86deg 16.3636deg),var(--bg);
  box-shadow:inset 0 0 0 16px var(--bg),inset 0 0 0 18px var(--gold)}
.hub::after{content:"";position:absolute;inset:34%;border-radius:50%;background:var(--bg);border:2px solid var(--gold)}
.nav{position:absolute;top:calc(20px + var(--cw)*.75 - 22px);width:44px;height:44px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);
  font-size:22px;line-height:1;cursor:pointer;z-index:2}
.nav.prev{left:2px}.nav.next{right:2px}
.wheel .cta{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:2;white-space:nowrap}
.wheel.deal{pointer-events:none}
.wheel.deal .wc{opacity:1}
.wheel.done{cursor:default}
.wheel.done .wc.cur{opacity:.38;--s:1}
.wheel.done .nav,.wheel.done .cta{display:none}
.slots{display:flex;justify-content:center;gap:clamp(8px,3vw,24px);width:100%}
.slot{display:flex;flex-direction:column;align-items:center;gap:8px;width:min(30%,170px)}
.slot b{font-size:14px;font-weight:600;letter-spacing:.1em;color:var(--gold)}
.place{width:100%;aspect-ratio:2/3;border:1.5px dashed var(--line);border-radius:12px;perspective:800px}
.flip{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .7s}
.flip.on{transform:rotateY(180deg)}
.flip > div{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px}
.face{transform:rotateY(180deg);background:var(--surface);color:var(--ink);border:2px solid var(--plum);overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 4px;text-align:center}
.face i{font-style:normal;font-size:12px;color:var(--soft);letter-spacing:.14em}
.face .sym{font-size:clamp(30px,9vw,54px);line-height:1;color:var(--plum);font-variant-emoji:text}
.face strong{font-size:clamp(13px,3.6vw,17px);font-weight:700;line-height:1.2}
.face.rev::after{content:"역방향";position:absolute;top:8px;right:8px;background:var(--surface);color:var(--plum);font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;z-index:1}
.face.pic{padding:0;border:0}
.face.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.face.pic strong{position:absolute;left:0;right:0;bottom:0;padding:5px 4px;background:#45182fcc;color:var(--surface)}
.reading{display:flex;flex-direction:column;gap:14px;width:100%}
.reading article{background:var(--surface);color:var(--ink);border-radius:16px;padding:16px 18px;animation:in .45s ease both}
.reading article:nth-child(2){animation-delay:.12s}.reading article:nth-child(3){animation-delay:.24s}
.reading h3{margin:0 0 2px;font-size:20px;font-weight:700;line-height:1.3}
.reading h3 em{font-style:normal;font-size:13px;font-weight:600;color:var(--plum);margin-left:8px}
.reading .kw{font-size:13px;color:var(--soft);margin:0 0 8px}
.reading p{margin:0}
.cta{align-self:center;background:var(--gold);color:#241505;border:0;border-radius:999px;padding:12px 34px;font-size:17px;font-weight:700;cursor:pointer}

/* 촛불 */
.candles{display:flex;justify-content:space-between;align-items:flex-end;height:120px;border-bottom:1px solid var(--line);padding:0 4px}
.candles div{display:flex;align-items:flex-end;gap:clamp(10px,3vw,26px)}
.c{width:20px;height:var(--h);background:var(--candle);border-radius:3px 3px 0 0;position:relative;box-shadow:inset -5px 0 0 #0003}
.c::before{content:"";position:absolute;left:50%;bottom:calc(100% + 4px);width:10px;height:18px;margin-left:-5px;background:#ffd76a;
  border-radius:50% 50% 50% 50%/65% 65% 35% 35%;box-shadow:0 0 14px 5px #ffb84d77;transform-origin:50% 100%;animation:flick 1.6s ease-in-out infinite alternate}
.c::after{content:"";position:absolute;left:50%;top:100%;width:30px;height:5px;margin-left:-15px;background:var(--gold);border-radius:2px}
.c:nth-child(2)::before{animation-delay:-.6s}.c:nth-child(3)::before{animation-delay:-1.1s}
@keyframes flick{from{transform:scale(1) rotate(-3deg)}to{transform:scale(1.1,.92) rotate(3deg)}}

footer{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:space-between;align-items:center;font-size:13px;color:var(--onsoft)}
.tools{display:flex;align-items:center;gap:10px}
.tools label{position:relative;border:1px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer;color:var(--on)}
.tools label:focus-within{outline:3px solid var(--star)}
@media (max-width:480px){.topic{width:72px}.topic .ring{width:60px;height:60px}.nav{width:38px;height:38px;top:calc(20px + var(--cw)*.75 - 19px)}}
@media (prefers-reduced-motion:reduce){.step,.reading article,.track,.c::before{animation:none}.flip,#spin,.wc{transition:none}.marquee{overflow-x:auto}}
</style>
</head>
<body>

<main class="shop">
  <svg id="wheel" viewBox="-200 -200 400 400" fill="none" stroke="currentColor" aria-hidden="true"></svg>
  <p class="brand">시사의 타로가게</p>

  <section class="teller">
    <div class="photo has" id="photoBox"><img src="sisa.png" alt="점술사 시사"></div>
    <div class="bubble" id="bubble" aria-live="polite"></div>
  </section>

  <section class="step" id="s-name">
    <h1>성함이 어떻게 되시나요~?</h1>
    <form class="ask" id="nameForm">
      <input id="userName" maxlength="10" placeholder="이름을 적어주세요…" autocomplete="off" aria-label="이름">
      <button class="go" type="submit" aria-label="이름 알려주기">→</button>
    </form>
    <div class="or"><span>또는</span></div>
    <button class="ghost" type="button" id="anon">익명으로 할게요</button>
  </section>

  <section class="step" id="s-home" hidden>
    <h1>운명의 비밀을 봐드립니다~</h1>
    <div class="topics" id="topics"></div>
    <button class="link" type="button" id="rename">이름 바꾸기</button>
  </section>

  <section class="step" id="s-ask" hidden>
    <h2>질문을 적어보시겠어요~?</h2>
    <p class="sub" id="askSub"></p>
    <form class="ask" id="askForm">
      <input id="question" maxlength="60" placeholder="질문을 적어주세요…" autocomplete="off" aria-label="질문">
      <button class="go" type="submit" aria-label="카드 펼치기">→</button>
    </form>
    <div class="marquee"><div class="track" id="track"></div></div>
    <div class="or"><span>또는</span></div>
    <button class="ghost" type="button" id="skip">질문 없이 바로 뽑기</button>
    <div class="row" id="spreads"></div>
    <button class="link" type="button" id="backHome">← 주제 다시 고르기</button>
  </section>

  <section class="step" id="s-pick" hidden>
    <h2 id="deckTitle"></h2>
    <p class="asked" id="asked"></p>
    <div class="wheel" id="deck">
      <div class="hub"></div>
      <div id="spin" aria-hidden="true"></div>
      <button class="nav prev" type="button" id="prev" aria-label="이전 카드">‹</button>
      <button class="nav next" type="button" id="next" aria-label="다음 카드">›</button>
      <button class="cta" type="button" id="take">이 카드 뽑기</button>
    </div>
    <div class="slots" id="slots"></div>
    <div class="reading" id="reading" hidden></div>
    <button class="link" type="button" id="backHome2">← 처음으로</button>
  </section>

  <div class="candles" aria-hidden="true">
    <div><i class="c" style="--h:78px"></i><i class="c" style="--h:46px"></i><i class="c" style="--h:26px"></i></div>
    <div><i class="c" style="--h:30px"></i><i class="c" style="--h:52px"></i><i class="c" style="--h:84px"></i></div>
  </div>

  <footer>
    <span>재미로 보는 타로입니다~ 중요한 결정은 손님이 직접 내려주세요!</span>
  </footer>
</main>

<script>
const ROMAN=["0","I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV","XV","XVI","XVII","XVIII","XIX","XX","XXI"];
// [이름, 기호, 정방향 키워드, 정방향 풀이, 역방향 키워드, 역방향 풀이]
const CARDS=[
["바보","✿","시작 · 모험 · 자유","새로운 시작이 보이네요~ 겁내지 말고 가볍게 한 발 내디뎌 보세요!","성급함 · 무계획","마음이 조금 앞서 있네요~ 한 번만 더 확인하고 가시면 좋겠어요."],
["마법사","✦","능력 · 실행 · 집중","필요한 건 이미 다 갖고 계시네요~ 지금 바로 손을 움직이시면 됩니다!","허세 · 재능 낭비","할 수 있는데 미뤄둔 일이 보이네요~ 말보다 행동이 먼저랍니다."],
["여사제","☾","직감 · 비밀 · 차분함","느낌이 맞을 가능성이 크네요~ 조용히 지켜보시면 답이 보일 거예요.","혼란 · 속마음 숨김","혼자 끙끙 앓고 계시네요~ 믿을 만한 분께 털어놓아 보세요."],
["여황제","❀","풍요 · 다정함 · 결실","공들인 게 포근하게 돌아오네요~ 오늘은 스스로를 잘 챙겨주셔도 됩니다!","과함 · 게으름","편한 것만 찾다 보면 흐트러지기 쉬워요~ 조금만 몸을 일으켜 보시겠어요?"],
["황제","♜","안정 · 책임 · 질서","계획대로 밀고 가시면 든든한 결과가 보이네요~ 중심을 꽉 잡으세요!","고집 · 통제","한 가지 방식만 고집하면 부딪힐 수 있어요~ 조금 느슨하게 풀어주세요."],
["교황","✚","배움 · 조언 · 전통","먼저 가본 분의 말씀에 지름길이 있네요~ 기본에 충실하시면 됩니다!","틀에 갇힘","남들 하는 대로만 하실 필요는 없어요~ 손님의 방식도 훌륭합니다."],
["연인","♥","사랑 · 선택 · 끌림","마음이 통하는 일이 보이네요~ 끌리는 쪽을 고르셔도 좋습니다!","엇갈림 · 망설임","마음이 두 갈래로 갈려 있네요~ 진짜 원하는 걸 먼저 정해 보세요."],
["전차","➤","전진 · 승리 · 의지","밀어붙이면 이기는 흐름이네요~ 한눈팔지 말고 쭉 달리세요!","폭주 · 방향 상실","속도는 빠른데 방향이 흔들리네요~ 잠깐 멈추고 지도를 보시겠어요?"],
["힘","♌","용기 · 인내 · 부드러운 힘","세게 나가는 것보다 다정하게 버티는 게 통하네요~ 손님은 생각보다 강하십니다!","자신감 부족","기가 조금 죽어 계시네요~ 지금까지 해내신 걸 떠올려 보세요."],
["은둔자","☄","성찰 · 혼자만의 시간","혼자 조용히 생각하는 시간이 답을 주네요~ 서두르지 않으셔도 됩니다.","고립 · 외로움","너무 오래 혼자 계셨네요~ 누군가에게 먼저 연락해 보시겠어요?"],
["운명의 수레바퀴","✺","행운 · 전환 · 타이밍","흐름이 좋은 쪽으로 바뀌는 게 보이네요~ 온 기회는 바로 잡으세요!","꼬임 · 타이밍 어긋남","잠깐 꼬일 수 있어요~ 지나가는 구간이니 조금만 버티시면 됩니다."],
["정의","⚖","공정 · 균형 · 결과","한 만큼 정확히 돌아오네요~ 솔직하게 하시면 손해 보지 않습니다!","불공평 · 회피","미뤄둔 일의 값이 돌아올 수 있어요~ 인정할 건 인정하고 가시죠."],
["매달린 사람","⚓","기다림 · 다른 시선","지금은 거꾸로 봐야 보이는 때네요~ 기다림이 헛되지 않을 거예요.","헛된 버팀","놓아야 할 걸 붙잡고 계시네요~ 이제 내려오셔도 됩니다."],
["죽음","✂","끝 · 정리 · 새 출발","하나가 끝나야 다음이 시작되네요~ 깔끔하게 정리해 보세요!","미련 · 변화 거부","끝난 걸 아직 못 보내고 계시네요~ 놓아주시면 훨씬 가벼워집니다."],
["절제","⚗","조화 · 균형 · 적당함","적당히 섞고 맞추면 딱 좋아지네요~ 무리하지 않는 게 정답입니다!","불균형 · 과유불급","한쪽으로 많이 쏠려 있네요~ 쉬는 것도 일정에 넣어주세요."],
["악마","⛓","유혹 · 집착 · 욕심","달콤한 유혹이 보이네요~ 즐기시되 끌려다니지는 마세요!","해방 · 끊어냄","발목 잡던 것에서 벗어날 수 있겠네요~ 지금이 끊을 기회입니다!"],
["탑","⚡","갑작스러운 변화 · 충격","예상 못 한 일이 판을 흔들 수 있어요~ 무너진 자리에 더 튼튼한 걸 세우시면 됩니다.","위기 모면","큰일 날 뻔한 걸 아슬아슬하게 피하시네요~ 경고로 받아들이시면 좋겠어요."],
["별","★","희망 · 회복 · 소원","바라던 일에 빛이 들어오네요~ 믿고 계속 가시면 됩니다!","실망 · 자신 없음","기대가 꺾여 힘이 빠지셨네요~ 소원은 아직 유효하답니다."],
["달","☽","불안 · 착각 · 꿈","안개가 낀 것처럼 흐릿하네요~ 확실해질 때까지 큰 결정은 미뤄주세요.","오해가 풀림","걱정하던 게 별일 아니었다는 걸 알게 되시겠네요~ 안심하셔도 좋습니다."],
["태양","☀","성공 · 기쁨 · 활력","뭘 해도 잘 풀리는 밝은 기운이네요~ 마음껏 즐기세요!","잠깐의 흐림","좋은 일이 조금 늦어질 뿐이에요~ 해는 곧 다시 나옵니다!"],
["심판","♪","부활 · 소식 · 결단","기다리던 소식이 오는 게 보이네요~ 다시 도전하시면 이번엔 다릅니다!","후회 · 망설임","지난 일을 자꾸 곱씹고 계시네요~ 이제 스스로를 용서해 주세요."],
["세계","◎","완성 · 성취 · 여행","긴 여정이 예쁘게 마무리되네요~ 충분히 뿌듯해하셔도 됩니다!","미완성 · 한 끗 부족","거의 다 오셨는데 마무리가 남았네요~ 마지막 한 걸음만 더 가보시죠!"]
];
// [기호, 이름, 풀이 머리말, 예시 질문]
const TOPICS=[
 ["☀","오늘의 운세","오늘은",["오늘 하루는 어떻게 흘러갈까요?","오늘 조심해야 할 게 있을까요?","오늘 좋은 소식이 있을까요?","지금 하려는 일, 해도 될까요?","오늘 누굴 만나면 좋을까요?"]],
 ["♥","연애","연애 쪽은",["그 사람은 저를 어떻게 생각할까요?","새로운 인연이 찾아올까요?","먼저 연락해도 괜찮을까요?","지금 관계는 어디로 흘러갈까요?","제가 놓치고 있는 마음이 있을까요?"]],
 ["✎","공부·일","공부나 일에서는",["이번 과제는 잘 마무리될까요?","시험 결과는 어떨까요?","지금 방향이 저한테 맞을까요?","팀 프로젝트는 무사히 끝날까요?","새로 도전해도 될까요?"]],
 ["✦","금전","돈 문제는",["이번 달 지갑 사정은 어떨까요?","사고 싶은 걸 사도 될까요?","뜻밖의 수입이 생길까요?","아껴야 할 때일까요?","알바를 시작해도 좋을까요?"]]
];
const SPREADS=[[1,"한 장",["뽑은 카드"]],[3,"세 장",["과거","현재","미래"]]];
const $=id=>document.getElementById(id);
const state={topic:0,spread:0,picked:[],question:"",name:""};
const who=()=>state.name?state.name+"님":"손님";
const IMG={}; for(let i=0;i<22;i++) IMG[i]=`cards/${i}.webp`;
const calm=matchMedia("(prefers-reduced-motion: reduce)").matches;

/* 뒤에 깔리는 별자리 원반 */
(function(){
  let h="";
  [190,170,120,112,60].forEach(r=>h+=`<circle r="${r}"/>`);
  for(let i=0;i<12;i++){const a=i*Math.PI/6, c=Math.cos(a), s=Math.sin(a);
    h+=`<path d="M${c*120} ${s*120}L${c*170} ${s*170}"/><circle cx="${c*180}" cy="${s*180}" r="2.5" fill="currentColor"/>`}
  const star=(n,k,r)=>"M"+[...Array(n)].map((_,i)=>{const a=i*k*2*Math.PI/n-Math.PI/2;return (Math.cos(a)*r).toFixed(1)+" "+(Math.sin(a)*r).toFixed(1)}).join("L")+"Z";
  h+=`<path d="${star(8,3,112)}"/><path d="${star(6,2,60)}"/>`;
  $("wheel").innerHTML=h;
})();

function say(t){$("bubble").textContent=t}
function show(id){
  ["s-name","s-home","s-ask","s-pick"].forEach(s=>$(s).hidden=s!==id);
  $(id).style.animation="none"; void $(id).offsetWidth; $(id).style.animation="";
}

/* 1단계: 주제 */
TOPICS.forEach((t,i)=>{
  const b=document.createElement("button"); b.type="button"; b.className="topic";
  b.innerHTML=`<span class="ring">${t[0]}</span><b>${t[1]}</b>`;
  b.onclick=()=>goAsk(i); $("topics").appendChild(b);
});
function goName(){show("s-name"); $("userName").value=state.name; say("어서 오세요~! 시사의 타로가게입니다!\n성함을 여쭤봐도 될까요~?")}
function goHome(){show("s-home"); say(`${who()}, 반갑습니다~!\n무엇을 봐드릴까요~?`)}
function setName(n){state.name=n; save("tarot-user",n); goHome()}
$("nameForm").addEventListener("submit",e=>{
  e.preventDefault(); const n=$("userName").value.trim();
  if(!n){say("성함이 비어 있네요~\n적어주시거나, 익명으로 하셔도 괜찮습니다!"); $("userName").focus(); return}
  setName(n);
});
$("anon").onclick=()=>setName("");
$("rename").onclick=goName;

SPREADS.forEach((s,i)=>{
  const b=document.createElement("button"); b.type="button"; b.className="chip"; b.textContent=s[1];
  b.onclick=()=>{state.spread=i; markSpread()}; $("spreads").appendChild(b);
});
function markSpread(){[...$("spreads").children].forEach((b,i)=>b.setAttribute("aria-pressed",i===state.spread))}
function goAsk(i){
  state.topic=i; const t=TOPICS[i];
  $("askSub").textContent=`${t[1]}에 대해 궁금한 걸 적으시면 그 질문으로 봐드려요.`;
  $("question").value="";
  const qs=t[3].concat(t[3]);
  $("track").innerHTML=qs.map((q,k)=>`<button class="q" type="button"${k>=t[3].length?' tabindex="-1" aria-hidden="true"':""}>${q}</button>`).join("");
  markSpread(); show("s-ask");
  say(`${who()}의 ${t[1]}, 정성껏 봐드리겠습니다!\n질문을 들려주시겠어요~?`);
}
$("track").addEventListener("click",e=>{const b=e.target.closest(".q"); if(b){$("question").value=b.textContent; $("question").focus()}});
$("askForm").addEventListener("submit",e=>{
  e.preventDefault(); const q=$("question").value.trim();
  if(!q){say("질문이 비어 있네요~\n적어주시거나, 아래 '질문 없이 바로 뽑기'를 눌러주세요!"); $("question").focus(); return}
  state.question=q; goPick();
});
$("skip").onclick=()=>{state.question=""; goPick()};
$("backHome").onclick=goHome;
$("backHome2").onclick=()=>{goHome(); window.scrollTo({top:0,behavior:calm?"auto":"smooth"})};

/* 3단계: 카드 */
const N=CARDS.length, STEP=360/N;
let rot=0, cur=0, order=[], R=330;
const mod=(a,n)=>((a%n)+n)%n;
function geom(){
  const d=$("deck"), W=d.clientWidth, cw=W<480?64:84;
  R=Math.max(cw*3.6,Math.min(W*.42,360));
  d.style.setProperty("--cw",cw+"px"); d.style.setProperty("--R",R+"px");
}
function apply(){
  $("spin").style.transform=`rotate(${rot}deg)`;
  cur=mod(Math.round(-rot/STEP),N);
  [...$("spin").children].forEach((c,i)=>c.classList.toggle("cur",i===cur));
}
function gone(i){return $("spin").children[i].classList.contains("gone")}
function turn(dir){ // 뽑힌 자리는 건너뛰기
  let k=0; do{rot-=dir*STEP; k++}while(gone(mod(Math.round(-rot/STEP),N))&&k<N);
  apply();
}
function goPick(){
  state.picked=[];
  const [n,,labels]=SPREADS[state.spread];
  order=CARDS.map((_,i)=>i);
  for(let i=N-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
  $("deck").classList.remove("done");
  $("spin").innerHTML=order.map((_,i)=>`<div class="wc back" data-i="${i}" style="--a:0deg"></div>`).join("");
  $("deckTitle").textContent=`${who()}, 카드를 ${n}장 골라주세요~`;
  $("asked").textContent=state.question?`“${state.question}”`:"";
  $("slots").innerHTML=labels.map(l=>`<div class="slot"><b>${l}</b><div class="place"></div></div>`).join("");
  $("reading").hidden=true; $("reading").innerHTML="";
  show("s-pick"); geom();
  // 차라락: 맨 위에 겹쳐 있다가 양옆으로 한 장씩 펼쳐짐
  rot=0; apply();
  const cards=[...$("spin").children];
  const ang=i=>(i<=N/2?i:i-N)*STEP;
  if(calm) cards.forEach((c,i)=>c.style.setProperty("--a",ang(i)+"deg"));
  else {
    $("deck").classList.add("deal"); void $("spin").offsetWidth;
    cards.forEach((c,i)=>{
      const k=Math.abs(i<=N/2?i:i-N);
      c.style.transition=`transform .55s cubic-bezier(.2,.8,.2,1) ${k*45}ms, opacity .3s`;
      c.style.setProperty("--a",ang(i)+"deg");
    });
    setTimeout(()=>{cards.forEach(c=>c.style.transition=""); $("deck").classList.remove("deal")},N/2*45+650);
  }
  say("좋습니다~!\n바퀴를 돌려 카드를 골라주세요~");
}
addEventListener("resize",()=>{if(!$("s-pick").hidden) geom()});
$("prev").onclick=()=>turn(-1);
$("next").onclick=()=>turn(1);
$("take").onclick=()=>pick();

/* 끌어서 돌리기, 카드를 누르면 그 카드가 위로 */
(function(){
  const d=$("deck"); let sx=0, base=0, moved=false, down=false, hit=null;
  d.addEventListener("pointerdown",e=>{
    if(e.target.closest("button")||d.classList.contains("done")) return;
    down=true; moved=false; sx=e.clientX; base=rot; hit=e.target.closest(".wc");
  });
  addEventListener("pointermove",e=>{
    if(!down) return; const dx=e.clientX-sx;
    if(!moved&&Math.abs(dx)>6){moved=true; d.classList.add("drag")}
    if(moved){rot=base+dx/R*57.2958; apply()}
  });
  const up=()=>{
    if(!down) return; down=false; d.classList.remove("drag");
    if(moved){rot=Math.round(rot/STEP)*STEP; apply(); if(gone(cur)) turn(1)}
    else if(hit){
      const i=+hit.dataset.i;
      if(i===cur) pick();
      else {rot-=(mod(i-cur+N/2,N)-N/2)*STEP; apply()}
    }
  };
  addEventListener("pointerup",up); addEventListener("pointercancel",up);
})();

function pick(){
  const [n]=SPREADS[state.spread];
  if(state.picked.length>=n||gone(cur)) return;
  const ci=order[cur];
  $("spin").children[cur].classList.add("gone");
  const rev=Math.random()<0.3, idx=state.picked.length, c=CARDS[ci];
  state.picked.push({ci,rev});
  const place=$("slots").querySelectorAll(".place")[idx];
  place.style.border="0";
  const inner=IMG[ci]
    ? `<div class="face pic${rev?" rev":""}"><img src="${IMG[ci]}" alt=""><strong>${c[0]}</strong></div>`
    : `<div class="face${rev?" rev":""}"><i>${ROMAN[ci]}</i><span class="sym">${c[1]}</span><strong>${c[0]}</strong></div>`;
  place.innerHTML=`<div class="flip"><div class="back"></div>${inner}</div>`;
  const flip=place.firstChild;
  setTimeout(()=>flip.classList.add("on"),80);
  const left=n-state.picked.length;
  if(left>0){ turn(1); say(`좋습니다~!\n${left}장 더 골라주세요~`); }
  else { $("deck").classList.add("done"); say("흐음~ 보이네요, 보여요~"); setTimeout(showReading,1100); }
}

function showReading(){
  const [,,labels]=SPREADS[state.spread];
  const lead=TOPICS[state.topic][2], many=state.picked.length>1;
  const html=state.picked.map((p,i)=>{
    const c=CARDS[p.ci], kw=p.rev?c[4]:c[2], txt=(p.rev?c[5]:c[3]).replace(/손님/g,who());
    const head=many?`${labels[i]} · `:"";
    const pre=many?(i===0?"지나온 시간을 보니, ":i===1?`지금 ${lead} `:"앞으로는 "):`${lead} `;
    return `<article><h3>${head}${c[0]}<em>${p.rev?"역방향":"정방향"}</em></h3><p class="kw">${kw}</p><p>${pre}${txt}</p></article>`;
  }).join("");
  $("reading").innerHTML=html+`<button class="cta" type="button" id="again">다시 한번 보시겠어요~?</button>`;
  $("reading").hidden=false;
  $("again").onclick=()=>{goHome(); window.scrollTo({top:0,behavior:calm?"auto":"smooth"})};
  const good=state.picked.filter(p=>!p.rev).length;
  say(good===state.picked.length?`오오~ ${who()}, 아주 좋은 카드가 보이네요~!\n풀이를 읽어보세요!`:good===0?"조심하실 게 조금 보이네요~\n미리 아셨으니 괜찮습니다!":"보이네요~\n좋은 것도, 챙기실 것도 있어요.\n아래 풀이를 봐주세요~");
}

function save(k,v){try{localStorage.setItem(k,v)}catch(_){}}
/* 둥둥 떠있기 */
if(!calm){
  const fl=$("photoBox");
  (function float(t){fl.style.transform=`translateY(${Math.sin(t/700)*8}px)`; requestAnimationFrame(float)})(0);
}
try{ state.name=localStorage.getItem("tarot-user")||""; }catch(_){}
goName();
</script>
</body>
</html>
